services:
  postgres:
    image: postgres:16-alpine
    container_name: pricewatch-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pricewatch}
      POSTGRES_USER: ${DB_USER:-pricewatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pricewatch_local_password}
    ports:
      - "5432:5432"
    volumes:
      - pricewatch-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pricewatch} -d ${DB_NAME:-pricewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pricewatch-app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pricewatch-postgres-data:
